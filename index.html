<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Home</title>
  <script src="main.js" type="module"></script>
  <link rel="stylesheet" href="./src/styles.css" />
</head>

<body class="relative">
  <!-- NAVBAR -->
  <nav class="flex justify-around bg-red-600 p-4">
    <a href="index.html" class="text-2xl text-white transition-transform duration-300 hover:scale-125 font-bold">
      Main Pokémon
    </a>
    <a href="pokedex.html" class="text-2xl text-white transition-transform duration-300 hover:scale-125 font-bold">
      Pokédex Favorites
    </a>
  </nav>

  <!-- input search and sort by -->
  <div class="flex justify-around mt-20 ml-40 mr-40">
    <input id="search" type="text" placeholder="Type Name Or Number"
      class="bg-gray-800 text-white placeholder-gray-400 border border-gray-600 p-2 w-80 h-12" />
    <button id="searchButton" type="button" class="bg-gray-500 hover:bg-gray-700 text-white p-2 ml-2 w-40 h-12">
      Search
    </button>

    <!-- select sort -->
    <select name="sort" id="sort-select"
      class="bg-red-400 hover:bg-red-500 text-white border border-red-600 p-2 ml-2 w-40 h-12 transition-colors duration-200">
      <option value="number">Sort by Number</option>
      <option value="name">Sort by Name</option>
    </select>
  </div>
  <hr class="border-t-2 border-gray-300 mt-20" />

  <!-- Pokemon Cards section-->
  <h1 class="text-4xl mt-20 font-bold mb-20 text-center text-gray-700">
    Pokemons List
  </h1>
  <div id="pokemonContainer" class="flex flex-wrap justify-center gap-4 p-4"></div>

</body>

</html>
